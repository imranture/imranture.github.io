<!DOCTYPE html>
<html lang="en-US">

<head>
    <!-- Basic Info -->
    <title>404 - Page Not Found | Imran Ture</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- SEO Meta Tags -->
    <meta name="title" content="404 - Page Not Found">
    <meta name="author" content="Imran Ture">
    <meta name="description" content="The page you're looking for doesn't exist.">
    <meta name="keywords" content="404, Page Not Found">
    <link rel="canonical" href="https://www.imranture.com/404.html">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/image/favicon.png">

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body, html {
          font-family: 'Lato', sans-serif;
          color: #222;
          height: 100%;
          margin: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
        }
        .content {
          text-align: center;
        }
        footer {
          position: absolute;
          bottom: 1%;
          width: 100%;
          text-align: center;
        }
        h1, h2 {
          color: #21404a;
        }
        .meme {
          margin: 1em 0 1em;
        }
        .meme img {
          max-width: 600px;
          max-height: 600px;
          width: auto;
          height: auto;
        }
        a, a:link, a:visited, a:hover {
          text-decoration: none;
          color: #007BFF;
        }
      </style>
      
</head>

<body>
    <div class="content">
        <h1>404 - Page Not Found</h1>
        <h2>Oops! The page you're looking for doesn't exist.</h2>
        <div class="meme">
            <img id="memeImage" alt="404 meme">
        </div>
        <p><a href="/">Go back</a></p>
    </div>

    <footer>
        <small>&copy; <span id="copyright-year"></span> Imran Ture. All rights reserved.</small>
    </footer>

    <!-- Update copyright year automatically -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var currentYear = new Date().getFullYear();
            document.getElementById("copyright-year").innerText = currentYear;

            var gifs = [
                'https://media.giphy.com/media/hU2z6FqL3eh6rjqiHA/giphy.gif',
                'https://media.giphy.com/media/Y2z4kPLUEDddnAjXwh/giphy.gif',
                'https://media.giphy.com/media/W6G6DU0Ten6dLYAD4t/giphy.gif',
                'https://media.giphy.com/media/ZcLIs0dScqyW2jz3QN/giphy.gif',
                'https://media.giphy.com/media/RIwnj1b1k1zT58SHqU/giphy.gif'
            ];

            var randomGif = gifs[Math.floor(Math.random() * gifs.length)];
            document.getElementById('memeImage').src = randomGif;
        });
    </script>
</body>

</html>
