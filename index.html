<body>
    <script>
        // Apply saved theme before page renders to prevent flash
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('theme-light');
        }
    </script>

    <!-- SVG Pattern Definitions: Animated backgrounds for skill cards -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <!-- Dots Pattern (Research) -->
            <pattern id="pattern-research" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="4" cy="4" r="1.5" fill="rgba(255, 255, 255, 0.15)"/>
                <circle cx="14" cy="14" r="1.5" fill="rgba(255, 255, 255, 0.15)"/>
                <circle cx="4" cy="14" r="1" fill="rgba(255, 255, 255, 0.1)"/>
                <circle cx="14" cy="4" r="1" fill="rgba(255, 255, 255, 0.1)"/>
            </pattern>
            
            <!-- Grid Pattern (Planning) -->
            <pattern id="pattern-planning" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <rect x="0" y="0" width="8" height="8" fill="rgba(255, 255, 255, 0.12)"/>
                <rect x="10" y="10" width="8" height="8" fill="rgba(255, 255, 255, 0.12)"/>
            </pattern>
            
            <!-- Slash Pattern (Development) -->
            <pattern id="pattern-development" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <line x1="0" y1="20" x2="20" y2="0" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
                <line x1="-5" y1="5" x2="5" y2="-5" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
                <line x1="15" y1="25" x2="25" y2="15" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
            </pattern>
            
            <!-- Waves Pattern (Testing) -->
            <pattern id="pattern-testing" x="0" y="0" width="40" height="20" patternUnits="userSpaceOnUse">
                <path d="M0 10 Q10 5, 20 10 T40 10" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" fill="none"/>
                <path d="M0 15 Q10 12, 20 15 T40 15" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" fill="none"/>
            </pattern>
            
            <!-- Backslash Pattern (Optimization) -->
            <pattern id="pattern-optimization" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="20" y2="20" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
                <line x1="-5" y1="-5" x2="5" y2="5" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
                <line x1="15" y1="15" x2="25" y2="25" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
            </pattern>
        </defs>
    </svg>

    <!-- Layout Container -->

        <!-- MAIN CONTENT -->
        <main class="main-content" role="main">
            <!-- Center Content Panel: Dynamic content area (intro or project details) -->
            <div id="center-panel" class="center-panel" role="region" aria-label="Main content area">
                <!-- Content will be injected by JavaScript -->
            </div>

            <div class="swipe-hint">
                <span class="swipe-icon-container">
                    <i class="fas fa-arrows-left-right arrows"></i>
                    <i class="fas fa-hand-pointer hand"></i>

                Tap or swipe to explore my expertise
            </div>
            <!-- Skills Card Deck: Interactive cards showing areas of expertise -->
            <section id="card-deck" class="card-deck" aria-label="Skills and expertise">
                <!-- Cards will be injected by JavaScript -->
            </section>

            <!-- Mobile-only Portfolio button -->
            <div class="mobile-projects-section">
                <button id="btn-projects-mobile" class="nav-btn mobile-projects-btn" aria-label="View the portfolio">
                    <i class="fas fa-layer-group" aria-hidden="true"></i> Portfolio
                </button>
            </div>
        </main>

        <!-- Projects Dropdown: Overlay menu listing all portfolio projects -->
        <div id="projects-dropdown-backdrop" class="dropdown-backdrop hidden" aria-hidden="true"></div>
        <div id="projects-dropdown" 
             class="projects-dropdown hidden"

            <div class="overlay-content">

                </button>
                <div id="project-detail-content" class="project-detail-content">
                    <!-- Project details will be injected by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark and light theme">
