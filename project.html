<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... - Imran Ture</title>

    <!-- Projects moved from /project.html?id=<id> to /projects/<id>/. GitHub Pages can't
         redirect on a query string, so old links are forwarded here. -->
    <script>
        var id = new URLSearchParams(location.search).get('id');
        location.replace(id && /^[a-z0-9-]+$/.test(id) ? '/projects/' + id + '/' : '/');
    </script>
</head>

<body>
    <p>This page has moved. <a href="/">Go to the homepage</a>.</p>
</body>

</html>
