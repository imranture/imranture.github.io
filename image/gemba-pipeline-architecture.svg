<svg viewBox="0 0 1060 694" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How one store report becomes a queryable demand signal. A report arrives as store visit notes with photos attached, listing several product groups and loose observations under each. The model reads text and photo together and pulls out what was observed, what kind of demand it signals, which product the reporter meant in their own words, and attributes visible in the photo. Those loose values are resolved against the company reference data: the store master, the merchandising taxonomy, the approved colour and material range, and the merchandising calendar. Merchandising and planning teams can then ask questions across every store and every report.">
<rect width="1060" height="694" fill="#1e2330"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<text x="530" y="42" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="600">From one report to a queryable signal</text>
<text x="530" y="65" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="400">The model reads loose description. The pipeline turns it into something the business already knows how to count.</text>
<rect x="30" y="100" width="400" height="356" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="46" y="126" text-anchor="start" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">WHAT ARRIVES</text>
<rect x="46" y="137" width="3" height="14" rx="1.5" fill="#f59e0b"/>
<text x="62" y="148" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="600">W34 Store Visit Notes — Store A</text>
<text x="62" y="168" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">Hi,</text>
<text x="62" y="185" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">Week 34 visit notes below.</text>
<text x="62" y="211" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">Group: Knitwear</text>
<rect x="46" y="217" width="3" height="14" rx="1.5" fill="#f59e0b"/>
<text x="62" y="228" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">Category: Short-sleeve knit tops</text>
<rect x="46" y="236" width="3" height="14" rx="1.5" fill="#f59e0b"/>
<text x="62" y="247" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">* Customers asking for more colour options.</text>
<text x="62" y="273" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">Group: Shirts</text>
<rect x="46" y="279" width="3" height="14" rx="1.5" fill="#f59e0b"/>
<text x="62" y="290" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">Category: Men&#8217;s linen shirts</text>
<rect x="46" y="298" width="3" height="36" rx="1.5" fill="#f59e0b"/>
<text x="62" y="309" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">* Requests for lighter shades.</text>
<text x="62" y="326" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="400">* Band collar styles getting good feedback.</text>
<rect x="62" y="342" width="84" height="60" rx="5" fill="#232a36" stroke="#3b4557" stroke-width="1"/>
<circle cx="82" cy="360" r="6" fill="#3b4557"/>
<path d="M67 397 L92 368 L110 390 L122 378 L141 397 Z" fill="#3b4557"/>
<text x="160" y="362" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">attached photo — carries the detail</text>
<text x="160" y="378" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">the sentence leaves out</text>
<text x="160" y="398" text-anchor="start" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="400">Email · mobile app · video walkthrough</text>
<text x="46" y="424" text-anchor="start" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="400">Amber marks the four facts every report must carry:</text>
<text x="46" y="440" text-anchor="start" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="400">where · when · which product · what happened.</text>
<line x1="434" y1="270" x2="456" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="460" y="100" width="270" height="356" rx="10" fill="none" stroke="#34d399" stroke-width="1.4"/>
<text x="476" y="126" text-anchor="start" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">WHAT THE MODEL PULLS OUT</text>
<rect x="476" y="150" width="238" height="40" rx="6" fill="#1f2937" stroke="#34d399" stroke-width="1"/>
<text x="488" y="174" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">What was observed</text>
<rect x="476" y="214" width="238" height="40" rx="6" fill="#1f2937" stroke="#34d399" stroke-width="1"/>
<text x="488" y="238" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">What kind of demand it signals</text>
<rect x="476" y="278" width="238" height="40" rx="6" fill="#1f2937" stroke="#34d399" stroke-width="1"/>
<text x="488" y="302" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Which product — in the reporter&#8217;s words</text>
<rect x="476" y="342" width="238" height="40" rx="6" fill="#1f2937" stroke="#34d399" stroke-width="1"/>
<text x="488" y="366" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Attributes visible in the photo</text>
<text x="476" y="424" text-anchor="start" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="600">One report, several separate signals.</text>
<line x1="734" y1="270" x2="756" y2="270" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="760" y="100" width="270" height="356" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
<text x="776" y="126" text-anchor="start" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">RESOLVED AGAINST COMPANY DATA</text>
<rect x="776" y="150" width="238" height="40" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
<text x="788" y="174" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Store master</text>
<rect x="776" y="214" width="238" height="40" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
<text x="788" y="238" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Merchandising taxonomy</text>
<rect x="776" y="278" width="238" height="40" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
<text x="788" y="302" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Approved colour &amp; material range</text>
<rect x="776" y="342" width="238" height="40" rx="6" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
<text x="788" y="366" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Merchandising calendar</text>
<text x="776" y="424" text-anchor="start" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="600">One structured row per signal.</text>
<rect x="30" y="488" width="1000" height="132" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
<text x="46" y="514" text-anchor="start" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="600">WHAT THE BUSINESS CAN NOW ASK</text>
<rect x="46" y="532" width="316" height="36" rx="6" fill="#1f2937" stroke="#a78bfa" stroke-width="1"/>
<text x="58" y="556" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Which stores are flagging stock gaps on knitwear?</text>
<rect x="374" y="532" width="316" height="36" rx="6" fill="#1f2937" stroke="#a78bfa" stroke-width="1"/>
<text x="386" y="556" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">What are customers asking for that we don&#8217;t carry?</text>
<rect x="702" y="532" width="316" height="36" rx="6" fill="#1f2937" stroke="#a78bfa" stroke-width="1"/>
<text x="714" y="556" text-anchor="start" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="400">Which product groups draw the most complaints?</text>
<text x="46" y="600" text-anchor="start" fill="#94a3b8" font-family="sans-serif" font-size="10.5" font-weight="400">Illustrative questions — asked across every store, every report, in plain language.</text>
<text x="530" y="662" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="400">The hard part isn&#8217;t reading the report. It&#8217;s deciding which of thousands of real products the reporter meant.</text>
</svg>