<svg viewBox="0 0 1000 890" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The agent loop behind the chatbot. A question posted to the streaming endpoint is dispatched as a CQRS query, logged to ClickHouse and resolved against conversation history in MongoDB. The agent orchestrator injects the domain glossary and correctness rules, calls Google's managed Data Analytics Agent as its NL-to-SQL tool, observes the result and retries once on a transient failure, and streams progress back to the browser over Server-Sent Events.">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="890" fill="#1e2330"/>

  <!-- UI -->
  <rect x="390" y="20" width="220" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="43" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Angular UI</text>
  <text x="500" y="62" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">external team · browser</text>

  <!-- UI <-> Router -->
  <line x1="470" y1="76" x2="470" y2="140" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="140" x2="530" y2="76" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="112" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">POST /ask/stream</text>
  <text x="542" y="112" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">SSE: progress → delta → done</text>

  <!-- Router -->
  <rect x="390" y="140" width="220" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="163" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">FastAPI Router</text>
  <text x="500" y="182" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">POST /ask/stream</text>

  <!-- Router <-> Handler -->
  <line x1="470" y1="196" x2="470" y2="260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="260" x2="530" y2="196" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="232" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">dispatch query</text>
  <text x="542" y="232" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">re-emit SSE stream</text>

  <!-- Handler -->
  <rect x="390" y="260" width="220" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="286" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">CQRS Query Handler</text>
  <text x="500" y="305" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">AskAgentQuery</text>

  <!-- ClickHouse -->
  <rect x="40" y="262" width="220" height="60" rx="8" fill="#241f33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="287" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">ClickHouse client</text>
  <text x="150" y="305" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">query + timing log</text>

  <!-- Handler -> ClickHouse -->
  <line x1="388" y1="292" x2="264" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="326" y="282" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">log (fire-and-forget)</text>

  <!-- MongoDB -->
  <rect x="740" y="262" width="220" height="60" rx="8" fill="#241f33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="850" y="287" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">MongoDB client</text>
  <text x="850" y="305" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">conversation state</text>

  <!-- Handler <-> MongoDB -->
  <line x1="612" y1="286" x2="736" y2="286" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <line x1="736" y1="300" x2="614" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="674" y="274" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">load / save history</text>

  <!-- Domain glossary + rules -->
  <rect x="40" y="400" width="240" height="76" rx="8" fill="#16241f" stroke="#34d399" stroke-width="1.5"/>
  <text x="160" y="425" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Domain glossary + rules</text>
  <text x="160" y="444" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">business terms → columns</text>
  <text x="160" y="461" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Turkish casing · padded text · nulls</text>

  <!-- Glossary -> orchestrator -->
  <line x1="284" y1="438" x2="386" y2="438" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
  <text x="335" y="428" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10.5">injected per request</text>

  <!-- Agent orchestrator -->
  <rect x="390" y="400" width="220" height="76" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="427" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Agent orchestrator</text>
  <text x="500" y="446" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">grounds prompt, resolves context</text>
  <text x="500" y="463" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">calls tool, observes, streams</text>

  <!-- Observe/retry loop -->
  <path d="M 610 424 C 666 424, 666 456, 610 456" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text x="678" y="435" text-anchor="start" fill="#f59e0b" font-family="sans-serif" font-size="11">observe + retry ×1</text>
  <text x="678" y="450" text-anchor="start" fill="#f59e0b" font-family="sans-serif" font-size="11">on empty / 500</text>

  <!-- Orchestrator <-> tool -->
  <line x1="470" y1="476" x2="470" y2="546" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="546" x2="530" y2="476" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="517" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">tool call (grounded question)</text>
  <text x="542" y="517" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">answer + SQL + job id</text>

  <!-- Managed tool boundary -->
  <rect x="348" y="548" width="304" height="254" rx="10" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="364" y="570" text-anchor="start" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">NL→SQL tool · Google-managed</text>

  <!-- Data Analytics Agent -->
  <rect x="380" y="584" width="240" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="609" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Data Analytics Agent</text>
  <text x="500" y="628" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">generates and runs the SQL</text>

  <!-- Agent <-> BigQuery -->
  <line x1="464" y1="648" x2="464" y2="714" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="536" y1="714" x2="536" y2="648" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="452" y="685" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">generated SQL</text>
  <text x="548" y="685" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">rows</text>

  <!-- BigQuery -->
  <rect x="380" y="716" width="240" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="741" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">BigQuery</text>
  <text x="500" y="760" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Gemba feedback + sales tables</text>

  <!-- Caption -->
  <text x="500" y="843" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">The agent loop, from question to grounded answer</text>
  <text x="500" y="866" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Ground the question, resolve it against history, call the NL→SQL tool, observe the result, retry once, stream as it goes.</text>
</svg>
