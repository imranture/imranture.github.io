<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Request path through the CQRS-style FastAPI pipeline: a question is dispatched as a query, grounded against a domain glossary before reaching Gemini and BigQuery, retried once on transient failure, and streamed back to the UI as progress events.">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="#14171f"/>

  <!-- UI -->
  <rect x="390" y="20" width="220" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="43" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Angular UI</text>
  <text x="500" y="62" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">external team · browser</text>

  <!-- Router -->
  <rect x="390" y="140" width="220" height="56" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="163" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">FastAPI Router</text>
  <text x="500" y="182" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">POST /ask/stream</text>

  <!-- Handler -->
  <rect x="390" y="260" width="220" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="286" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">CQRS Query Handler</text>
  <text x="500" y="305" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">AskAgentQuery</text>

  <!-- ClickHouse -->
  <rect x="40" y="400" width="220" height="64" rx="8" fill="#241f33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="426" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">ClickHouse client</text>
  <text x="150" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">query + timing log</text>

  <!-- Gemini + BigQuery NL-to-SQL client -->
  <rect x="390" y="400" width="220" height="76" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="424" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Gemini + BigQuery</text>
  <text x="500" y="441" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">NL→SQL client</text>
  <text x="500" y="461" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">grounded by glossary + rules</text>

  <!-- MongoDB -->
  <rect x="740" y="400" width="220" height="64" rx="8" fill="#241f33" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="850" y="426" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">MongoDB client</text>
  <text x="850" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">conversation state</text>

  <!-- BigQuery warehouse -->
  <rect x="390" y="560" width="220" height="64" rx="8" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="586" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">BigQuery</text>
  <text x="500" y="605" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Gemba feedback + sales tables</text>

  <!-- UI <-> Router -->
  <line x1="470" y1="76" x2="470" y2="140" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="140" x2="530" y2="76" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="112" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">POST /ask/stream</text>
  <text x="542" y="112" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">SSE: progress → delta → done</text>

  <!-- Router <-> Handler -->
  <line x1="470" y1="196" x2="470" y2="260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="260" x2="530" y2="196" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="232" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">dispatch query</text>
  <text x="542" y="232" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">re-emit SSE stream</text>

  <!-- Handler -> ClickHouse -->
  <line x1="430" y1="324" x2="185" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="290" y="368" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">log (fire-and-forget)</text>

  <!-- Handler <-> NL-to-SQL -->
  <line x1="470" y1="324" x2="470" y2="400" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="400" x2="530" y2="324" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="365" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">ask (grounded)</text>
  <text x="542" y="357" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">answer + job id</text>

  <!-- Handler -> MongoDB -->
  <line x1="580" y1="324" x2="820" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
  <text x="720" y="378" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10.5">load / save history</text>

  <!-- NL-to-SQL <-> BigQuery -->
  <line x1="470" y1="476" x2="470" y2="560" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="530" y1="560" x2="530" y2="476" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="458" y="522" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="11">generated SQL</text>
  <text x="542" y="522" text-anchor="start" fill="#cbd5e1" font-family="sans-serif" font-size="11">rows</text>

  <!-- Retry loop -->
  <path d="M 390 424 C 335 424, 335 456, 390 456" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text x="325" y="444" text-anchor="end" fill="#f59e0b" font-family="sans-serif" font-size="11">retry ×1 on</text>
  <text x="325" y="459" text-anchor="end" fill="#f59e0b" font-family="sans-serif" font-size="11">empty / 500</text>

  <!-- Caption -->
  <text x="500" y="700" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">CQRS request pipeline, from question to grounded answer</text>
  <text x="500" y="722" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Every question is grounded against the domain glossary before it reaches Gemini + BigQuery,</text>
  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">retried once on a transient failure, and streamed back to the UI as it progresses.</text>
</svg>
